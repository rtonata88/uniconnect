                  example: 6ff8f7f6-1eb3-3525-be4a-3932c805afed
                text:
                  type: string
                  description: 'This field is required when <code>attachment_id</code> is not present. Must not be greater than 50000 characters.'
                  example: g
                  nullable: true
                attachment_id:
                  type: integer
