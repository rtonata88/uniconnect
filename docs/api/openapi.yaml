openapi: 3.0.3
info:
  title: 'UniConnect API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'https://localhost'
tags:
  -
    name: 'Admin: courses'
    description: ''
  -
    name: 'Admin: system'
    description: ''
  -
    name: 'Admin: users'
    description: ''
  -
    name: Announcements
    description: ''
  -
    name: Assignments
    description: ''
  -
    name: Authentication
    description: ''
  -
    name: 'Course materials'
    description: ''
  -
    name: Courses
    description: ''
  -
    name: Dashboard
    description: ''
  -
    name: Endpoints
    description: ''
  -
    name: Files
    description: ''
  -
    name: Gradebook
    description: ''
  -
    name: 'Messaging: conversations'
    description: ''
  -
    name: 'Messaging: messages'
    description: ''
  -
    name: Notifications
    description: ''
  -
    name: Profile
    description: ''
  -
    name: 'Quiz attempts'
    description: ''
  -
    name: Quizzes
    description: ''
  -
    name: Submissions
    description: ''
  -
    name: Sync
    description: ''
  -
    name: System
