paths:
  /api/admin/courses:
    get:
      summary: 'List courses'
      operationId: listCourses
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin: courses'
      security: []
    post:
      summary: 'Create a course (LMS-1)'
      operationId: createACourseLMS1
      description: 'Also creates the course group chat. Optional lecturer_ids enrols lecturers.'
      parameters: []
      responses: {}
      tags:
        - 'Admin: courses'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 20 characters.'
                  example: bngzmiyvdljnikhw
                title:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: a
                description:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: 'Perspiciatis quo omnis nostrum aut adipisci quidem nostrum qui.'
                  nullable: true
                semester:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: v
                  nullable: true
                lecturer_ids:
                  type: array
                  description: ''
                  example:
                    - 16
                  items:
                    type: integer
              required:
                - code
                - title
      security: []
  '/api/admin/courses/{course_id}':
    patch:
      summary: 'Update a course'
      operationId: updateACourse
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin: courses'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: 'Must contain only letters, numbers, dashes and underscores. Must not be greater than 20 characters.'
                  example: bngzmiyvdljnikhw
                title:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: a
                description:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: 'Perspiciatis quo omnis nostrum aut adipisci quidem nostrum qui.'
                  nullable: true
                semester:
                  type: string
                  description: 'Must not be greater than 40 characters.'
                  example: v
                  nullable: true
      security: []
    delete:
      summary: 'Delete a course'
      operationId: deleteACourse
      description: 'Soft delete: the course disappears for every member on their next sync.'
      parameters: []
      responses: {}
      tags:
        - 'Admin: courses'
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/admin/courses/{course_id}/enrolments':
    post:
      summary: 'Enrol users (LMS-1)'
      operationId: enrolUsersLMS1
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin: courses'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  description: 'Users to enrol.'
                  example:
                    - 4
                    - 5
                  items:
                    type: integer
                role:
                  type: string
                  description: 'lecturer or student.'
                  example: student
              required:
                - user_ids
                - role
      security: []
    delete:
      summary: 'Remove enrolments (LMS-1)'
      operationId: removeEnrolmentsLMS1
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin: courses'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  description: ''
                  example:
                    - 4
                  items:
                    type: integer
              required:
                - user_ids
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  /api/admin/audit-logs:
    get:
      summary: 'Audit log (SEC-9)'
      operationId: auditLogSEC9
      description: ''
      parameters:
        -
          in: query
          name: action
          description: 'Action prefix, e.g. `auth.` or `grade.released`.'
          example: auth.
          required: false
          schema:
            type: string
            description: 'Action prefix, e.g. `auth.` or `grade.released`.'
            example: auth.
        -
          in: query
          name: user_id
          description: Actor.
          example: 1
          required: false
          schema:
            type: integer
            description: Actor.
            example: 1
        -
          in: query
          name: from
          description: 'date ISO date (inclusive).'
          example: '2026-10-01'
          required: false
          schema:
            type: string
            description: 'date ISO date (inclusive).'
            example: '2026-10-01'
        -
          in: query
          name: to
          description: 'date ISO date (inclusive).'
          example: '2026-10-31'
          required: false
          schema:
            type: string
            description: 'date ISO date (inclusive).'
            example: '2026-10-31'
      responses: {}
      tags:
        - 'Admin: system'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  description: ''
                  example: 16
                  nullable: true
                from:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-25T09:13:00'
                  nullable: true
                to:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-25T09:13:00'
                  nullable: true
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 200.'
                  example: 22
                  nullable: true
      security: []
  /api/admin/system:
    get:
      summary: 'System status (DIST-6)'
      operationId: systemStatusDIST6
      description: "Every registered instance (api, reverb, worker, scheduler) with heartbeat age and uptime,\nwhat the gateway routes to, MySQL primary + replica (replication lag), Redis, MinIO,\nqueue sizes and live WebSocket connections."
      parameters: []
      responses: {}
      tags:
        - 'Admin: system'
      security: []
  /api/admin/users:
    get:
      summary: 'List users'
      operationId: listUsers
      description: ''
      parameters:
        -
          in: query
          name: search
          description: 'Name, email or student number.'
          example: student1
          required: false
          schema:
            type: string
            description: 'Name, email or student number.'
            example: student1
        -
          in: query
          name: role
          description: 'admin, lecturer or student.'
          example: student
          required: false
          schema:
            type: string
            description: 'admin, lecturer or student.'
            example: student
        -
          in: query
          name: active
          description: 'Filter by active flag.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Filter by active flag.'
            example: true
      responses: {}
      tags:
        - 'Admin: users'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  description: ''
                  example: admin
                  enum:
                    - admin
                    - lecturer
                    - student
                  nullable: true
                per_page:
                  type: integer
                  description: 'Must be at least 1. Must not be greater than 200.'
                  example: 1
                  nullable: true
      security: []
    post:
      summary: 'Create a user (AUTH-6)'
      operationId: createAUserAUTH6
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Admin: users'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must be at least 2 characters. Must not be greater than 120 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: zbailey@example.net
                role:
                  type: string
                  description: ''
                  example: admin
                  enum:
                    - admin
                    - lecturer
                    - student
                student_number:
                  type: string
                  description: 'Must not be greater than 30 characters.'
                  example: i
                  nullable: true
                password:
                  type: string
                  description: ''
                  example: '|]|{+-'
                is_active:
                  type: boolean
                  description: ''
                  example: false
              required:
                - name
                - email
                - role
                - password
      security: []
  /api/admin/users/import:
    post:
      summary: 'Import users from CSV (AUTH-6)'
      operationId: importUsersFromCSVAUTH6
      description: "Columns (header row required): name, email, role, student_number (optional),\npassword (optional; a random one is generated and returned when missing).\nRows are validated individually; valid rows are created, invalid rows reported."
      parameters: []
      responses: {}
      tags:
        - 'Admin: users'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'CSV file.'
              required:
                - file
      security: []
  '/api/courses/{course_id}/announcements':
    get:
      summary: 'List announcements'
      operationId: listAnnouncements
      description: ''
      parameters: []
      responses: {}
      tags:
        - Announcements
      security: []
    post:
      summary: 'Post an announcement (LMS-4)'
      operationId: postAnAnnouncementLMS4
      description: "Enrolled users are notified. `client_uuid` makes the call idempotent so drafts\nwritten offline are never posted twice (MOB-5)."
      parameters: []
      responses: {}
      tags:
        - Announcements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: b
                body:
                  type: string
                  description: 'Must not be greater than 20000 characters.'
                  example: 'n'
                publish:
                  type: boolean
                  description: ''
                  example: false
                client_uuid:
                  type: string
                  description: 'Must be a valid UUID.'
                  example: 6b72fe4a-5b40-307c-bc24-f79acf9a1bb9
                  nullable: true
              required:
                - title
                - body
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/announcements/{announcement_id}':
    patch:
      summary: 'Update an announcement'
      operationId: updateAnAnnouncement
      description: ''
      parameters: []
      responses: {}
      tags:
        - Announcements
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: b
                body:
                  type: string
                  description: 'Must not be greater than 20000 characters.'
                  example: 'n'
                publish:
                  type: boolean
                  description: ''
                  example: true
                updated_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-25T09:13:00'
                  nullable: true
      security: []
    delete:
      summary: 'Delete an announcement'
      operationId: deleteAnAnnouncement
      description: ''
      parameters: []
      responses: {}
      tags:
        - Announcements
      security: []
    parameters:
      -
        in: path
        name: announcement_id
        description: 'The ID of the announcement.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/courses/{course_id}/assignments':
    get:
      summary: 'List assignments'
      operationId: listAssignments
      description: 'Students get their own submission in `my_submission`.'
      parameters: []
      responses: {}
      tags:
        - Assignments
      security: []
    post:
      summary: 'Create an assignment (LMS-5)'
      operationId: createAnAssignmentLMS5
      description: ''
      parameters: []
      responses: {}
      tags:
        - Assignments
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/assignments/{assignment_id}':
    get:
      summary: 'Assignment details'
      operationId: assignmentDetails
      description: ''
      parameters: []
      responses: {}
      tags:
        - Assignments
      security: []
    patch:
      summary: 'Update an assignment'
      operationId: updateAnAssignment
      description: ''
      parameters: []
      responses: {}
      tags:
        - Assignments
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                updated_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-25T09:13:00'
                  nullable: true
      security: []
    delete:
      summary: 'Delete an assignment'
      operationId: deleteAnAssignment
      description: ''
      parameters: []
      responses: {}
      tags:
        - Assignments
      security: []
    parameters:
      -
        in: path
        name: assignment_id
        description: 'The ID of the assignment.'
        example: 1
        required: true
        schema:
          type: integer
  /api/auth/login:
    post:
      summary: 'Log in (AUTH-1)'
      operationId: logInAUTH1
      description: "Returns a Sanctum bearer token (expires after 7 days). Five failed attempts per\nminute for the same email + IP lock the pair for the rest of the minute."
      parameters: []
      responses: {}
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
                password:
                  type: string
                  description: 'Must not be greater than 255 characters.'
                  example: '+-0pBNvYgxwmi/#iw'
                device_name:
                  type: string
                  description: 'Must not be greater than 100 characters.'
                  example: u
                  nullable: true
              required:
                - email
                - password
      security: []
  /api/auth/forgot-password:
    post:
      summary: 'Request a password reset link (AUTH-3)'
      operationId: requestAPasswordResetLinkAUTH3
      description: "Always answers with the same message so it cannot be used to discover accounts.\nIn development the link is written to the log (MAIL_MAILER=log)."
      parameters: []
      responses: {}
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 255 characters.'
                  example: gbailey@example.net
              required:
                - email
      security: []
  /api/auth/reset-password:
    post:
      summary: 'Reset the password with the emailed token (AUTH-3)'
      operationId: resetThePasswordWithTheEmailedTokenAUTH3
      description: 'Revokes every existing token for the account.'
      parameters: []
      responses: {}
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: ''
                  example: architecto
                email:
                  type: string
                  description: 'Must be a valid email address.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: ''
                  example: architecto
              required:
                - token
                - email
                - password
      security: []
  /api/auth/logout:
    post:
      summary: 'Log out (AUTH-2)'
      operationId: logOutAUTH2
      description: 'Revokes the token used for this request.'
      parameters: []
      responses: {}
      tags:
        - Authentication
      security: []
  /api/auth/logout-all:
    post:
      summary: 'Log out all devices (AUTH-2)'
      operationId: logOutAllDevicesAUTH2
      description: ''
      parameters: []
      responses: {}
      tags:
        - Authentication
      security: []
  '/api/courses/{course_id}/materials':
    get:
      summary: 'List materials'
      operationId: listMaterials
      description: 'Grouped by week on the client. Students only see published materials.'
      parameters: []
      responses: {}
      tags:
        - 'Course materials'
      security: []
    post:
      summary: 'Upload a material (LMS-3)'
      operationId: uploadAMaterialLMS3
      description: 'Upload the file with POST /attachments first, then send its id here.'
      parameters: []
      responses: {}
      tags:
        - 'Course materials'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: b
                description:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: 'Et animi quos velit et fugiat.'
                  nullable: true
                week:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 60.'
                  example: 1
                attachment_id:
                  type: integer
                  description: ''
                  example: 16
                publish:
                  type: boolean
                  description: ''
                  example: true
              required:
                - title
                - week
                - attachment_id
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/materials/{material_id}':
    patch:
      summary: 'Update a material'
      operationId: updateAMaterial
      description: 'Send the `updated_at` you edited to get 409 if someone changed it meanwhile.'
      parameters: []
      responses: {}
      tags:
        - 'Course materials'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  description: 'Must not be greater than 200 characters.'
                  example: b
                description:
                  type: string
                  description: 'Must not be greater than 5000 characters.'
                  example: 'Et animi quos velit et fugiat.'
                  nullable: true
                week:
                  type: integer
                  description: 'Must be at least 0. Must not be greater than 60.'
                  example: 1
                attachment_id:
                  type: integer
                  description: ''
                  example: 16
                publish:
                  type: boolean
                  description: ''
                  example: false
                updated_at:
                  type: string
                  description: 'Must be a valid date.'
                  example: '2026-10-25T09:13:00'
                  nullable: true
      security: []
    delete:
      summary: 'Delete a material'
      operationId: deleteAMaterial
      description: ''
      parameters: []
      responses: {}
      tags:
        - 'Course materials'
      security: []
    parameters:
      -
        in: path
        name: material_id
        description: 'The ID of the material.'
        example: 1
        required: true
        schema:
          type: integer
  /api/courses:
    get:
      summary: 'My courses'
      operationId: myCourses
      description: 'Courses the user is enrolled in (admins: every course).'
      parameters: []
      responses: {}
      tags:
        - Courses
      security: []
  '/api/courses/{course_id}':
    get:
      summary: 'Course details'
      operationId: courseDetails
      description: ''
      parameters: []
      responses: {}
      tags:
        - Courses
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/courses/{course_id}/people':
    get:
      summary: 'People in a course'
      operationId: peopleInACourse
      description: 'Lecturers and students enrolled in the course.'
      parameters: []
      responses: {}
      tags:
        - Courses
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  /api/dashboard:
    get:
      summary: 'Role-aware dashboard (PRD 10.1, LMS-11)'
      operationId: roleAwareDashboardPRD101LMS11
      description: "Student: upcoming deadlines, recent announcements, unread chats.\nLecturer: submissions to grade and recent activity. Admin: counts and a health summary."
      parameters: []
      responses: {}
      tags:
        - Dashboard
      security: []
  /api/health:
    get:
      summary: "Health check (no auth). Used by Traefik, the heartbeat sidecar and the client's\nconnectivity probe. Returns 503 when the database or Redis is unreachable."
      operationId: healthChecknoAuthUsedByTraefikTheHeartbeatSidecarAndTheClientsConnectivityProbeReturns503WhenTheDatabaseOrRedisIsUnreachable
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/broadcasting/auth:
    get:
      summary: 'Authenticate the request for channel access.'
      operationId: authenticateTheRequestForChannelAccess
      description: ''
      parameters: []
      responses: {}
      tags:
        - Endpoints
      security: []
  /api/attachments:
    post:
      summary: 'Upload a file (SEC-5)'
      operationId: uploadAFileSEC5
      description: "Multipart upload, max 20 MB. Allowed: pdf, doc(x), ppt(x), xlsx, txt, csv, zip and images.\nThe returned id is then sent with the material, submission or message."
      parameters: []
      responses: {}
      tags:
        - Files
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'The file.'
              required:
                - file
      security: []
  '/api/attachments/{attachment_id}':
    get:
      summary: 'Download a file (SEC-4)'
      operationId: downloadAFileSEC4
      description: "Checks the policy, then redirects (302) to a presigned URL valid for 5 minutes.\nWith `?json=1` it returns the URL instead (for <img> tags and offline downloads)."
      parameters:
        -
          in: query
          name: json
          description: 'Return JSON instead of redirecting.'
          example: true
          required: false
          schema:
            type: boolean
            description: 'Return JSON instead of redirecting.'
            example: true
      responses: {}
      tags:
        - Files
      security: []
    parameters:
      -
        in: path
        name: attachment_id
        description: 'The ID of the attachment.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/courses/{course_id}/gradebook':
    get:
      summary: 'Gradebook grid (LMS-10, lecturer)'
      operationId: gradebookGridLMS10Lecturer
      description: 'Students × grade items with the weighted total (percent).'
      parameters: []
      responses: {}
      tags:
        - Gradebook
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
        required: true
        schema:
          type: integer
  '/api/courses/{course_id}/gradebook/export':
    get:
      summary: 'Export the gradebook as CSV (LMS-10)'
      operationId: exportTheGradebookAsCSVLMS10
      description: ''
      parameters: []
      responses: {}
      tags:
        - Gradebook
      security: []
    parameters:
      -
        in: path
        name: course_id
        description: 'The ID of the course.'
        example: 1
