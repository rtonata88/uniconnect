  /api/sync:
    get:
      summary: 'Delta sync (PRD 9.3)'
      operationId: deltaSyncPRD93
      description: "Everything the user can see that changed after `since`. Start without `since`; then pass\nthe returned `cursor` and loop while `has_more`. Clients upsert by id, so the small\noverlap between rounds never creates duplicates. `memberships` lists every course and\nconversation the user still belongs to so clients can drop the rest."
      parameters:
