# UniConnect on Laravel Forge: paste into the site's Nginx config (Site → Nginx configuration),
# inside the `server { listen 443 ... }` block. It replaces Forge's default `location /`,
# `location ~ \.php$` and `location ~ /\.(?!well-known).*` blocks. Keep Forge's ssl_* and include lines.
# Also change `root` to: /home/forge/YOUR-DOMAIN/frontend/dist
#
# Nginx is the gateway here (Traefik does this locally): the PWA is static, the API runs in
# Octane on 127.0.0.1:8001 (scripts/run-api.sh) and Reverb on 127.0.0.1:8101 (scripts/run-reverb.sh).

client_max_body_size 25m;   # uploads are capped at 20 MB by the app

# API, broadcasting auth, signed file downloads, Horizon -> Octane
location ~ ^/(api|horizon|vendor/horizon)(/|$) {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8001;
}

# WebSockets (Laravel Echo -> Reverb): /app/{key} for clients, /apps/{id}/... for the HTTP API
location ~ ^/apps?/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "Upgrade";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_pass http://127.0.0.1:8101;
}

# Hashed build assets: cache forever
location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
}

# Service worker, manifest and app shell must always be revalidated, or updates never arrive
location ~ ^/(sw\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options nosniff;
    try_files $uri =404;
}

# The PWA (single-page app: unknown paths fall back to index.html)
location / {
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self'; manifest-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
}

# dotfiles (but allow Let's Encrypt challenges)
location ~ /\.(?!well-known).* {
    deny all;
}
